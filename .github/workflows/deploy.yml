name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create redirect page
        run: |
          mkdir redirect
          cat > redirect/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=https://yewton.github.io/web-toys/solitaire-cascade/" />
              <title>Moved</title>
            </head>
            <body>
              <p>This page has moved to <a href="https://yewton.github.io/web-toys/solitaire-cascade/">yewton.github.io/web-toys/solitaire-cascade/</a>.</p>
              <script>window.location.replace("https://yewton.github.io/web-toys/solitaire-cascade/")</script>
            </body>
          </html>
          EOF
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: redirect/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
